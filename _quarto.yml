project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - modules/dnanexus-onboarding/index.qmd
    - modules/dnanexus-onboarding/participant-guide/*.qmd
    
website:
  title: "MCPS Training Kit"
  page-navigation: true
  
  sidebar:
  - title: "Getting Started"
    style: "docked"
    contents:
      - modules/dnanexus-onboarding/index.qmd
      
      - section: "Getting started"
        contents:
          - modules/dnanexus-onboarding/participant-guide/01-before-you-begin.qmd
          - modules/dnanexus-onboarding/participant-guide/02-dnanexus-basics.qmd
          - modules/dnanexus-onboarding/participant-guide/03-start-jupyterlab.qmd

      - section: "Working in DNAnexus"
        contents:
          - modules/dnanexus-onboarding/participant-guide/04-open-dx-notebook.qmd
          - modules/dnanexus-onboarding/participant-guide/05-work-with-project-data.qmd
          - modules/dnanexus-onboarding/participant-guide/06-save-your-work.qmd
          - modules/dnanexus-onboarding/participant-guide/07-end-your-jupyterlab-session.qmd
          - modules/dnanexus-onboarding/participant-guide/08-return-and-continue.qmd

      - section: "Guidance and reference"
        contents:
          - modules/dnanexus-onboarding/participant-guide/09-data-safety-and-downloading.qmd
          - modules/dnanexus-onboarding/participant-guide/10-quick-reference-and-troubleshooting.qmd

      - section: "Advanced"
        contents:
          - modules/dnanexus-onboarding/participant-guide/11-advanced-save-standalone-outputs.qmd

  navbar:
    left:
      - href: index.qmd
        text: Home
  
      - href: modules/dnanexus-onboarding/index.qmd
        text: Getting Started
  
      - href: modules/dnanexus-onboarding/participant-guide/09-data-safety-and-downloading.qmd
        text: Data Safety

    right:
      - icon: github
        href: https://github.com/mcps-analysts/mcps-training
        aria-label: GitHub
format:
  html:
    theme: cosmo
    toc: true
    toc-location: right
    number-sections: false
    smooth-scroll: true
    code-copy: true
    css: assets/styles/mcps.css
